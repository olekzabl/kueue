# job1.yaml
apiVersion: batch/v1
kind: Job
metadata:
  generateName: job1-$id-
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: $lq
    kueue.x-k8s.io/priority-class: $prio
spec:
  parallelism: 1
  completions: 1
  template:
    spec:
      containers:
      - name: dummy-job
        image: registry.k8s.io/e2e-test-images/agnhost:2.53
        command: [ "/bin/sh" ]
        args: [ "-c", "sleep $duration" ]
        resources:
          requests:
            cpu: $cpu
            memory: "100M"
      restartPolicy: Never

